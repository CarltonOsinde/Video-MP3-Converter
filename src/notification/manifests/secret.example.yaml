# Copy to secret.yaml (git-ignored), fill in real values, then kubectl apply.
# For Gmail, use an app password rather than your account password.
apiVersion: v1
kind: Secret
metadata:
  name: notification-secret
type: Opaque
stringData:
  SMTP_SENDER: you@example.com
  SMTP_USER: you@example.com
  SMTP_PASSWORD: change-me
