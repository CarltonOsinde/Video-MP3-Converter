# Runs the whole system locally. Credentials here are for local development only.
#   docker compose up --build
#   docker compose exec auth python create_user.py you@example.com
# Gateway: http://localhost:8080 · RabbitMQ UI: http://localhost:15672 (guest/guest)
# Mailpit (catches outgoing email): http://localhost:8025

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local-root-password
      MYSQL_DATABASE: auth
      MYSQL_USER: auth_user
      MYSQL_PASSWORD: local-dev-password
    volumes:
      - ./src/auth/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

  mongo:
    image: mongo:7

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "8025:8025"

  auth:
    build: ./src/auth
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: auth_user
      MYSQL_PASSWORD: local-dev-password
      MYSQL_DB: auth
      JWT_SECRET: local-dev-jwt-secret-change-me-in-production
    depends_on:
      mysql:
        condition: service_healthy

  gateway:
    build: ./src/gateway
    ports:
      - "8080:8080"
    environment:
      AUTH_SVC_ADDRESS: auth:5000
      MONGO_URI: mongodb://mongo:27017
      RABBITMQ_HOST: rabbitmq
    depends_on:
      auth:
        condition: service_started
      mongo:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  converter:
    build: ./src/converter
    environment:
      MONGO_URI: mongodb://mongo:27017
      RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  notification:
    build: ./src/notification
    environment:
      RABBITMQ_HOST: rabbitmq
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
      SMTP_SENDER: noreply@mp3converter.local
      DOWNLOAD_BASE_URL: http://localhost:8080
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure
